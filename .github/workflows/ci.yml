name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  public-pack-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MISE_LOCKED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up toolchain
        uses: jdx/mise-action@v3
        with:
          version: 2026.7.17
          cache: true

      - name: Verify repository
        run: mise run ci
